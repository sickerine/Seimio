[package]
name = "seimio-core"
version = "0.1.0"
edition = "2021"

# Stremio's own core (accounts, library, watched state, catalogs, the player's progress rules), behind a C
# interface for the Qt plugin (native/src/core.h). HTTP is the host's: the app answers `fetch` with Qt's
# network stack, so there is one HTTP client, one certificate store and one record/replay for the previews.
[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "core-lab"
path = "src/bin/lab.rs"

[dependencies]
stremio-core = { git = "https://github.com/Stremio/stremio-core", branch = "development", features = ["derive", "env-future-send"] }
futures = { version = "0.3", features = ["thread-pool"] }
serde = "1"
serde_json = "1"
http = "1"
chrono = "0.4"
once_cell = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
